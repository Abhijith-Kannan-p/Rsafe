# Render Blueprint: one free web service built from the Dockerfile.
# In Render: New > Blueprint > pick this repository. See README "Deploy".
services:
  - type: web
    name: rsafe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: RSAFE_SESSION_SECRET
        generateValue: true   # Render creates a random secret once and keeps it
      - key: RSAFE_DEMO_MODE
        value: "1"            # "0" removes the Tamper and Reset demo buttons
